<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- AWS Orange Gradient -->
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB84D" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <!-- DevOps Cyan Gradient -->
    <linearGradient id="devopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0073BB" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0B0F19" />
  
  <!-- DevOps Infinity Loop (Subtle in background) -->
  <path d="M 30,50 C 30,40 42,40 50,50 C 58,60 70,60 70,50 C 70,40 58,40 50,50 C 42,60 30,60 30,50 Z" 
        fill="none" stroke="url(#devopsGrad)" stroke-width="4" opacity="0.4" />

  <!-- AWS Cloud Shape -->
  <path d="M 25,60 
           A 12,12 0 0,1 25,36 
           A 18,18 0 0,1 55,25 
           A 15,15 0 0,1 78,35 
           A 12,12 0 0,1 75,59 Z" 
        fill="url(#awsGrad)" filter="url(#glow)" />
        
  <!-- Terminal Prompt Symbol (White/Cyan, crisp in foreground) -->
  <path d="M 40,42 L 48,50 L 40,58" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="52" y1="58" x2="62" y2="58" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" />
</svg>