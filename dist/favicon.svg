<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cloud-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0B0F19" />
  <rect width="90" height="90" x="5" y="5" rx="15" fill="#111827" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />
  <!-- Cloud Contour -->
  <path d="M 35 60 A 15 15 0 0 1 45 35 A 22 22 0 0 1 75 40 A 15 15 0 0 1 70 70 L 35 70 Z" fill="none" stroke="url(#cloud-gradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Prompt Symbol >_ -->
  <path d="M 20 40 L 32 48 L 20 56" fill="none" stroke="#FF9900" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="38" y1="56" x2="52" y2="56" stroke="#00D2FF" stroke-width="5" stroke-linecap="round" />
</svg>
